[tools]
node = "22.14.0"
ruby = "3.4.3"

# Environment variables for development
[env]
# Load variables from .env file first (includes DOMAIN, FLEXILE_DOMAIN, etc.)
_.file = '.env'

# Development-specific overrides

# Derived environment variables that depend on .env values
# These use lazy evaluation to access .env variables
AWS_ENDPOINT_URL = { value = "https://minio.{{env.FLEXILE_DOMAIN}}", tools = true }
FLEXILE_API_DOMAIN = { value = "api.{{env.FLEXILE_DOMAIN}}", tools = true }
FLEXILE_MINIO_DOMAIN = { value = "minio.{{env.FLEXILE_DOMAIN}}", tools = true }
FLEXILE_MINIO_CONSOLE_DOMAIN = { value = "minio-console.{{env.FLEXILE_DOMAIN}}", tools = true }

# === MAIN DEVELOPMENT TASKS ===

[tasks.setup]
alias = "install"
description = "🚀 Complete project setup - replaces bin/setup"
run = """
#!/usr/bin/env bash
set -e
echo "🚀 Setting up Flexile development environment..."

# Check prerequisites
if ! command -v docker &> /dev/null; then
  echo "❌ Docker not found. Please install Docker first."
  exit 1
fi

# Install dependencies
echo "📦 Installing dependencies..."
corepack enable
cd backend && bundle install && gem install foreman && cd ..
cd frontend && pnpm install && cd ..

# Check environment
echo "⚙️ Checking environment..."
if [ ! -f .env ]; then
  echo "❌ .env file not found. Please create .env file with required variables."
  echo "💡 You can copy .env.test as a starting point if available."
  exit 1
fi

# Link frontend env
ln -sf $PWD/.env ./frontend/.env

# Setup MinIO buckets
echo "🪣 Setting up MinIO..."
mise run minio:setup

echo "✅ Setup complete! Run 'mise run dev' to start the application."
"""

[tasks.dev]
alias = "start"
description = "🚀 Start development server - replaces bin/dev"
depends = ["docker:up"]
run = """
#!/usr/bin/env bash
set -e

# Check environment
if [ ! -f ".env" ]; then
    echo ".env file not found. Please run 'mise run setup' first."
    exit 1
fi

# Ensure mise Ruby is used (override RVM)
echo "💎 Setting up Ruby environment..."
export PATH="$(mise where ruby)/bin:$PATH"
unset GEM_HOME GEM_PATH RUBY_VERSION
unset -f rvm >/dev/null 2>&1 || true
eval "$(mise env --shell bash)"

# Install dependencies if needed
echo "📦 Installing Node.js dependencies..."
pnpm install

# Generate SSL certificates if CREATE_CERTS is enabled
if [ "${CREATE_CERTS:-true}" = "true" ]; then
  echo "🔐 Generating SSL certificates..."
  mkdir -p certificates
  NODE_EXTRA_CA_CERTS_FILE="$(node docker/createCertificate.js)"

  # Generate combined SSL certificates
  mkdir -p tmp
  default_cert_file=$(ruby -ropenssl -e 'puts OpenSSL::X509::DEFAULT_CERT_FILE')
  combined_cert_file="tmp/combined_ca_certs.pem"

  if [ -f "$default_cert_file" ] && [ -f "$NODE_EXTRA_CA_CERTS_FILE" ]; then
    cat "$default_cert_file" "$NODE_EXTRA_CA_CERTS_FILE" > "$combined_cert_file"
    echo "Combined certificates created at $combined_cert_file"
    export SSL_CERT_FILE="$(pwd)/$combined_cert_file"
    export NODE_EXTRA_CA_CERTS="$(pwd)/$combined_cert_file"
  else
    echo "Warning: Could not create combined cert file. Using default certificates."
  fi
else
  echo "⏭️  Skipping SSL certificate generation (CREATE_CERTS=false)"
fi

# Prepare backend
echo "🔧 Preparing backend..."
cd backend
bundle install
echo "🗄️ Preparing database..."
bin/rails db:prepare
cd ..

# Clean up existing processes
echo "🧹 Cleaning up existing processes..."
pkill -f "rails.*server" || true
pkill -f "node.*next" || true
pkill -f "sidekiq" || true
lsof -ti:3000 | xargs kill -9 2>/dev/null || true
lsof -ti:3001 | xargs kill -9 2>/dev/null || true
lsof -ti:8288 | xargs kill -9 2>/dev/null || true
rm -f backend/tmp/pids/server.pid

echo "🚀 Starting application services..."
export SSL_CERT_FILE NODE_EXTRA_CA_CERTS PATH
foreman start -f Procfile.dev "$@"
"""

[tasks."dev:test"]
alias = "test-server"
description = "🧪 Start test server - replaces bin/test_server"
env = { NODE_TLS_REJECT_UNAUTHORIZED = "0", RAILS_ENV = "test", NODE_ENV = "test", ENABLE_DEFAULT_OTP = "true" }
run = """
#!/usr/bin/env bash
set -e

echo "🧪 Starting test server..."

# Clean up existing processes
pkill -f "rails.*server" || true
pkill -f "node.*next" || true
lsof -ti:3100 | xargs kill -9 2>/dev/null || true
lsof -ti:3101 | xargs kill -9 2>/dev/null || true
lsof -ti:3037 | xargs kill -9 2>/dev/null || true
lsof -ti:8298 | xargs kill -9 2>/dev/null || true

# Setup test database
cd backend
bundle exec rails db:drop db:create db:schema:load db:seed_test_data
cd ..

foreman start -f Procfile.test -e .env.test
"""

# === DOCKER DEVELOPMENT ===

[tasks."docker:configure"]
description = "🔧 Generate Docker configuration from templates"
run = """
#!/usr/bin/env bash
set -e
echo "🔧 Generating Docker configuration from templates..."

# Source environment variables
if [ ! -f .env ]; then
  echo "❌ .env file not found. Please run 'mise run setup' first."
  exit 1
fi

# Load .env variables (safely)
set -a
source .env
set +a

# Set derived domains if not set
export FLEXILE_APP_DOMAIN="${APP_DOMAIN:-app.${FLEXILE_DOMAIN}}"
export FLEXILE_API_DOMAIN="${FLEXILE_API_DOMAIN:-api.${FLEXILE_DOMAIN}}"
export FLEXILE_MINIO_DOMAIN="${FLEXILE_MINIO_DOMAIN:-minio.${FLEXILE_DOMAIN}}"
export FLEXILE_MINIO_CONSOLE_DOMAIN="${FLEXILE_MINIO_CONSOLE_DOMAIN:-minio-console.${FLEXILE_DOMAIN}}"

# Process nginx template
echo "🌐 Processing nginx configuration template..."
envsubst '${FLEXILE_DOMAIN} ${FLEXILE_APP_DOMAIN} ${FLEXILE_API_DOMAIN} ${FLEXILE_MINIO_DOMAIN} ${FLEXILE_MINIO_CONSOLE_DOMAIN}' \
  < docker/flexile_dev.conf.template > docker/flexile_dev_docker.conf

echo "✅ Docker configuration generated successfully!"
echo "📄 Generated: docker/flexile_dev_docker.conf"
echo "🏷️  Domains configured:"
echo "   - Main: ${FLEXILE_DOMAIN}"
echo "   - App: ${FLEXILE_APP_DOMAIN:-${APP_DOMAIN}}"
echo "   - API: ${FLEXILE_API_DOMAIN}"
echo "   - MinIO: ${FLEXILE_MINIO_DOMAIN}"
echo "   - MinIO Console: ${FLEXILE_MINIO_CONSOLE_DOMAIN}"
"""

[tasks."docker:dev"]
alias = "docker:start"
description = "🐳 Start Docker development environment"
depends = ["docker:configure"]
run = """
#!/usr/bin/env bash
set -e
echo "🚀 Starting Flexile Docker development environment..."

# Check Docker
if ! docker info &> /dev/null; then
  echo "❌ Docker daemon is not running. Please start Docker."
  exit 1
fi

# Detect docker-compose command
if docker compose version &> /dev/null; then
  DOCKER_COMPOSE="docker compose"
elif command -v docker-compose &> /dev/null; then
  DOCKER_COMPOSE="docker-compose"
else
  echo "❌ Docker Compose not found. Please install Docker Compose."
  exit 1
fi

# Start services
$DOCKER_COMPOSE -f docker-compose.dev.yml up -d --build

# Setup MinIO buckets
echo "🪣 Setting up MinIO buckets..."
sleep 5  # Wait for MinIO to start

# Create buckets using direct docker exec
docker exec flexile-minio sh -c "
  mc alias set local http://localhost:9000 minioadmin minioadmin123 2>/dev/null || true &&
  mc mb --ignore-existing local/flexile-development-private &&
  mc mb --ignore-existing local/flexile-development-public &&
  mc anonymous set download local/flexile-development-public
" || echo "⚠️  MinIO setup will be retried later"

echo "✅ Development environment started successfully!"
echo ""
echo "🌐 Services available at:"
echo "   Main App: https://{{env.FLEXILE_DOMAIN}}"
echo "   API: https://api.{{env.FLEXILE_DOMAIN}}"
echo "   MinIO: https://minio.{{env.FLEXILE_DOMAIN}}"
echo "   MinIO Console: https://minio-console.{{env.FLEXILE_DOMAIN}}"
echo ""
echo "   Direct ports:"
echo "   Rails: http://localhost:3000"
echo "   Next.js: http://localhost:3001"
echo "   PostgreSQL: localhost:5432"
echo "   Redis: localhost:6389"
"""

[tasks."docker:stop"]
description = "🛑 Stop Docker development environment"
run = """
#!/usr/bin/env bash
echo "🛑 Stopping Docker services..."

if docker compose version &> /dev/null; then
  DOCKER_COMPOSE="docker compose"
elif command -v docker-compose &> /dev/null; then
  DOCKER_COMPOSE="docker-compose"
else
  echo "❌ Docker Compose not found"
  exit 1
fi

$DOCKER_COMPOSE -f docker-compose.dev.yml down
echo "✅ Services stopped"
"""

[tasks."docker:restart"]
description = "🔄 Restart Docker development environment"
depends = ["docker:configure"]
run = """
#!/usr/bin/env bash
echo "🔄 Restarting Docker services..."
mise run docker:stop
mise run docker:dev
"""

[tasks."docker:logs"]
description = "📋 Show Docker logs"
run = """
#!/usr/bin/env bash
if [ -n "$1" ]; then
  docker logs -f "flexile-$1"
else
  if docker compose version &> /dev/null; then
    docker compose -f docker-compose.dev.yml logs -f
  elif command -v docker-compose &> /dev/null; then
    docker-compose -f docker-compose.dev.yml logs -f
  fi
fi
"""

[tasks."docker:console"]
description = "📟 Open Rails console in Docker"
raw = true
run = "docker exec -it flexile-backend bundle exec rails console"

[tasks."docker:migrate"]
description = "🗄️ Run database migrations in Docker"
run = """
#!/usr/bin/env bash
echo "🗄️ Running database migrations..."
docker exec flexile-backend bundle exec rails db:migrate
echo "✅ Migrations completed"
"""

[tasks."docker:reset"]
description = "💣 Reset Docker environment (deletes volumes)"
confirm = "This will delete all Docker volumes and data. Are you sure?"
run = """
#!/usr/bin/env bash
echo "🔄 Resetting Docker environment..."

if docker compose version &> /dev/null; then
  DOCKER_COMPOSE="docker compose"
elif command -v docker-compose &> /dev/null; then
  DOCKER_COMPOSE="docker-compose"
else
  echo "❌ Docker Compose not found"
  exit 1
fi

$DOCKER_COMPOSE -f docker-compose.dev.yml down -v --remove-orphans
echo "✅ Environment reset complete"
"""

[tasks."docker:status"]
description = "📊 Show Docker service status"
run = """
#!/usr/bin/env bash
echo "📊 Service Status:"
if docker compose version &> /dev/null; then
  docker compose -f docker-compose.dev.yml ps
elif command -v docker-compose &> /dev/null; then
  docker-compose -f docker-compose.dev.yml ps
fi
"""

[tasks."docker:rebuild"]
description = "🔨 Rebuild Docker images"
run = """
#!/usr/bin/env bash
SERVICE=${1:-""}
if [ -n "$SERVICE" ]; then
  echo "🔨 Rebuilding $SERVICE service..."
  if docker compose version &> /dev/null; then
    docker compose -f docker-compose.dev.yml build --no-cache "$SERVICE"
  elif command -v docker-compose &> /dev/null; then
    docker-compose -f docker-compose.dev.yml build --no-cache "$SERVICE"
  fi
else
  echo "🔨 Rebuilding all services..."
  if docker compose version &> /dev/null; then
    docker compose -f docker-compose.dev.yml build --no-cache
  elif command -v docker-compose &> /dev/null; then
    docker-compose -f docker-compose.dev.yml build --no-cache
  fi
fi
echo "✅ Rebuild complete"
"""

[tasks."docker:setup"]
description = "🚀 Initial Docker setup (configure + certificates)"
depends = ["docker:configure"]
run = """
#!/usr/bin/env bash
echo "🚀 Initial Docker setup..."
if [ "${CREATE_CERTS:-true}" = "true" ]; then
  echo "🔐 Generating SSL certificates..."
  node docker/createCertificate.js
else
  echo "⏭️  Skipping SSL certificate generation (CREATE_CERTS=false)"
fi
echo "✅ Setup complete. Run 'mise run docker:dev' to start services."
"""

# === ALL-IN-ONE CONTAINER ===

[tasks."docker:all-in-one:build"]
description = "🏗️ Build the all-in-one container"
run = """
#!/usr/bin/env bash
echo "🏗️ Building Flexile all-in-one container..."
docker build -f docker/Dockerfile.all-in-one -t flexile-all-in-one:latest .
echo "✅ All-in-one container built successfully!"
"""

[tasks."docker:all-in-one:run"]
alias = "docker:aio"
description = "🚀 Run the all-in-one container"
run = """
#!/usr/bin/env bash
echo "🚀 Starting Flexile all-in-one container..."

# Stop any existing container
docker stop flexile-aio 2>/dev/null || true
docker rm flexile-aio 2>/dev/null || true

# Run the container
docker run -d \
  --name flexile-aio \
  -p 80:80 \
  -p 443:443 \
  -p 3000:3000 \
  -p 3001:3001 \
  -p 5432:5432 \
  -p 6379:6379 \
  -p 9000:9000 \
  -p 9001:9001 \
  -v flexile-aio-postgres:/var/lib/postgresql/data \
  -v flexile-aio-redis:/var/lib/redis \
  -v flexile-aio-minio:/var/lib/minio \
  -v $(pwd):/app:cached \
  --add-host {{env.FLEXILE_DOMAIN}}:127.0.0.1 \
  --add-host {{env.APP_DOMAIN}}:127.0.0.1 \
  --add-host api.{{env.FLEXILE_DOMAIN}}:127.0.0.1 \
  --add-host minio.{{env.FLEXILE_DOMAIN}}:127.0.0.1 \
  --add-host minio-console.{{env.FLEXILE_DOMAIN}}:127.0.0.1 \
  flexile-all-in-one:latest

echo "⏳ Waiting for services to start..."
sleep 10

echo "📊 Container status:"
docker ps --filter name=flexile-aio --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

echo ""
echo "✅ All-in-one container started!"
echo ""
echo "🌐 Access points:"
echo "  - Application: https://{{env.FLEXILE_DOMAIN}} or https://{{env.APP_DOMAIN}}"
echo "  - API: https://api.{{env.FLEXILE_DOMAIN}}"
echo "  - MinIO Console: https://minio-console.{{env.FLEXILE_DOMAIN}} (minioadmin/minioadmin123)"
echo "  - MinIO API: https://minio.{{env.FLEXILE_DOMAIN}}"
echo ""
echo "💡 Tips:"
echo "  - View logs: mise docker:all-in-one:logs"
echo "  - Shell access: mise docker:all-in-one:shell"
echo "  - Stop container: mise docker:all-in-one:stop"
"""

[tasks."docker:all-in-one:stop"]
description = "🛑 Stop the all-in-one container"
run = """
#!/usr/bin/env bash
echo "🛑 Stopping Flexile all-in-one container..."
docker stop flexile-aio
echo "✅ Container stopped"
"""

[tasks."docker:all-in-one:logs"]
description = "📋 Show all-in-one container logs"
run = """
#!/usr/bin/env bash
echo "📋 All-in-one container logs (Ctrl+C to exit):"
docker logs -f flexile-aio
"""

[tasks."docker:all-in-one:shell"]
description = "🐚 Open shell in all-in-one container"
raw = true
run = "docker exec -it flexile-aio /bin/bash"

[tasks."docker:all-in-one:status"]
description = "📊 Check all-in-one container service status"
run = """
#!/usr/bin/env bash
echo "📊 All-in-one container service status:"
docker exec flexile-aio supervisorctl status
echo ""
echo "🏥 Health check:"
docker exec flexile-aio /usr/local/bin/health-check.sh
"""

[tasks."docker:all-in-one:restart"]
description = "🔄 Restart all-in-one container services"
run = """
#!/usr/bin/env bash
echo "🔄 Restarting services in all-in-one container..."
docker exec flexile-aio supervisorctl restart all
echo "✅ Services restarted"
"""

[tasks."docker:all-in-one:clean"]
description = "🧹 Remove all-in-one container and volumes"
confirm = "This will delete the all-in-one container and all its data. Are you sure?"
run = """
#!/usr/bin/env bash
echo "🧹 Cleaning up all-in-one container..."
docker stop flexile-aio 2>/dev/null || true
docker rm flexile-aio 2>/dev/null || true
docker volume rm flexile-aio-postgres flexile-aio-redis flexile-aio-minio 2>/dev/null || true
echo "✅ All-in-one container cleaned up"
"""

