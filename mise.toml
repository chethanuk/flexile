# === TAILSCALE CERTIFICATE MANAGEMENT ===

[tasks."tailscale:certs"]
description = "📜 Copy tailscale certificates to local certs directory"
run = """
#!/usr/bin/env bash
set -e
echo "📜 Copying tailscale certificates..."

# Create certs directory
mkdir -p certs

# Copy tailscale certificates
if [ -f /var/lib/tailscale/certs/${FLEXILE_DOMAIN}.crt ] && [ -f /var/lib/tailscale/certs/${FLEXILE_DOMAIN}.key ]; then
  sudo cp "/var/lib/tailscale/certs/${FLEXILE_DOMAIN}.crt" "certs/"
  sudo cp "/var/lib/tailscale/certs/${FLEXILE_DOMAIN}.key" "certs/"
  sudo chown -R $(whoami):$(id -gn) certs/
  echo "✅ Tailscale certificates copied successfully"
  echo "📄 Certificate: certs/${FLEXILE_DOMAIN}.crt"
  echo "🔑 Private key: certs/${FLEXILE_DOMAIN}.key"
else
  echo "❌ Tailscale certificates not found at /var/lib/tailscale/certs/"
  echo "💡 Run: sudo tailscale cert --cert-file=${FLEXILE_DOMAIN}.crt --key-file=${FLEXILE_DOMAIN}.key ${FLEXILE_DOMAIN}"
  exit 1
fi
"""

