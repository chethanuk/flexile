events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker DNS resolver with IPv6 disabled
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 10s;

    # Common proxy headers and timeouts
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   X-Forwarded-Ssl   on;
    proxy_redirect     off;
    keepalive_timeout  75s;
    proxy_read_timeout 120s;

    # Redirect HTTP to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main application (Next.js) + HMR
    server {
        listen 443 ssl http2;
        server_name vpswebtr.wind-bee.ts.net app.vpswebtr.wind-bee.ts.net;

        ssl_certificate     /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.crt;
        ssl_certificate_key /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.key;

        client_max_body_size 10M;

        # WebSocket HMR
        location /_next/webpack-hmr {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Frontend
        location / {
            proxy_pass http://localhost:3001;
        }
    }

    # API server (Rails)
    server {
        listen 443 ssl http2;
        server_name api.vpswebtr.wind-bee.ts.net;

        ssl_certificate     /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.crt;
        ssl_certificate_key /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.key;

        client_max_body_size 10M;

        location / {
            proxy_pass http://localhost:3000;
        }
    }

    # MinIO S3 API
    server {
        listen 443 ssl http2;
        server_name minio.vpswebtr.wind-bee.ts.net;

        ssl_certificate     /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.crt;
        ssl_certificate_key /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.key;

        client_max_body_size 50M;

        location / {
            proxy_pass http://localhost:9000;
            proxy_connect_timeout 300;
        }
    }

    # MinIO Console
    server {
        listen 443 ssl http2;
        server_name minio-console.vpswebtr.wind-bee.ts.net;

        ssl_certificate     /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.crt;
        ssl_certificate_key /etc/ssl/tailscale/vpswebtr.wind-bee.ts.net.key;

        client_max_body_size 50M;

        location / {
            proxy_pass http://localhost:9001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 300;
        }
    }
}